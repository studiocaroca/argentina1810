<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Argentina 1810 — elegí tu acceso.">
    <meta name="robots" content="noindex, follow">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Argentina 1810">
    <meta property="og:description" content="This is where Argentina begins.">
    <meta property="og:locale" content="es_AR">

    <title>Argentina 1810</title>
    <link rel="icon" type="image/png" href="/assets/imgs/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap">

    <style>
        /* Brand tokens — manual de marca "Argentina 1810" */
        :root {
            --color-primary: #7208B7;
            /* Tech Purple */
            --color-secondary: #B979F7;
            /* Deep Mauve */
            --color-accent: #EFBB52;
            /* Traditional Gold */
            --color-accent-light: #FED16E;
            /* Golden Glow */
            --color-neutral: #D3D3D3;
            /* Light Gray */
            --font-heading: 'Andor', 'Anton', 'Archivo Black', 'League Gothic', sans-serif;
            --font-body: 'Montserrat', sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: var(--font-body);
            color: #fff;
            background: #933CD5;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: clamp(32px, 6vh, 64px);
            text-align: center;
            overflow-x: hidden;
        }

        /* Fondo-01 — recreated from the original design file (assets/imgs/fondos/Fondos-01.png)
           as layered, animatable shapes instead of a static raster. The source is a tall
           (2250x4000) portrait pattern: 3 parallel diagonal bands nested in a bowtie/hourglass
           shape, mirrored on both axes, in 4 purple shades, plus two inset gold rules near the
           top/bottom edges. Colors and the diagonal boundary positions were sampled pixel-by-pixel
           from the source file so this matches it closely. Each band is its own layer so it can
           independently drift — that's the "animate it" part a flat PNG background can't do.
           `xMidYMid slice`-equivalent behavior comes for free here since every layer is
           percentage-based and fixed to the viewport. */
        .fondo01 {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: #933CD5;
        }

        .fondo01__layer {
            position: absolute;
            inset: 0;
            will-change: transform;
        }

        /* Same bands as the original fondo-01 recreation, rotated 90° — the
           light/dark banding that ran left-to-right (converging toward a
           vertical mid-line) now runs top-to-bottom (converging toward a
           horizontal mid-line), so the sway animation drifts vertically
           (translateY) instead of sideways. */
        .fondo01__layer--a {
            background: #8628C9;
            clip-path: polygon(0% -8.04%, 50% 29.7%, 100% -8.04%, 100% 108.04%, 50% 70.3%, 0% 108.04%);
            animation: fondoDriftA 8s ease-in-out infinite;
        }

        .fondo01__layer--b {
            background: #7914BE;
            clip-path: polygon(0% -1.75%, 50% 36%, 100% -1.75%, 100% 101.75%, 50% 64%, 0% 101.75%);
            animation: fondoDriftB 9.5s ease-in-out infinite;
            animation-delay: -2.5s;
        }

        .fondo01__layer--c {
            background: var(--color-primary);
            clip-path: polygon(0% 4.53%, 50% 42.2%, 100% 4.53%, 100% 95.47%, 50% 57.8%, 0% 95.47%);
            animation: fondoDriftC 11s ease-in-out infinite;
            animation-delay: -5s;
        }

        .fondo01__line {
            position: absolute;
            top: 5.2%;
            bottom: 5.2%;
            width: 2px;
            background: var(--color-accent-light);
            animation: fondoGlow 5s ease-in-out infinite;
        }

        .fondo01__line--top {
            left: 2.75%;
        }

        .fondo01__line--bottom {
            right: 2.75%;
            animation-delay: -2.5s;
        }

        @keyframes fondoDriftA {

            0%,
            100% {
                transform: translateY(-14%);
            }

            50% {
                transform: translateY(14%);
            }
        }

        @keyframes fondoDriftB {

            0%,
            100% {
                transform: translateY(12%);
            }

            50% {
                transform: translateY(-12%);
            }
        }

        @keyframes fondoDriftC {

            0%,
            100% {
                transform: translateY(-10%);
            }

            50% {
                transform: translateY(10%);
            }
        }

        @keyframes fondoGlow {

            0%,
            100% {
                opacity: 0.55;
            }

            50% {
                opacity: 1;
            }
        }


        .splash-brand {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .splash-logo {
            width: clamp(220px, 32vw, 340px);
            height: auto;
            display: block;
        }

        .splash-slogan {
            font-family: var(--font-heading);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            line-height: 1.05;
            font-size: clamp(0.95rem, 2.5vw, 1.6rem);
        }

        .splash-slogan .accent {
            color: var(--color-accent);
        }

        .splash-cta-group {
            position: relative;
            z-index: 1;
            margin-top: clamp(20px, 5vh, 48px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .splash-options {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(20px, 4vw, 36px);
            width: 100%;
            max-width: 760px;
        }

        .splash-card {
            flex: 1 1 260px;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 40px 28px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            text-decoration: none;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
            transition: transform 0.18s ease, background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .splash-card:hover,
        .splash-card:focus-visible {
            transform: translateY(-4px);
            background: var(--color-secondary);
            border-color: transparent;
            box-shadow: 0 14px 40px rgba(76, 4, 121, 0.45);
            outline: none;
        }

        .splash-card__label {
            font-family: var(--font-heading);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: clamp(1.35rem, 3.4vw, 1.9rem);
            line-height: 1.1;
        }

        .splash-card__desc {
            font-size: 0.9rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }

        .splash-card:hover .splash-card__desc,
        .splash-card:focus-visible .splash-card__desc {
            color: rgba(255, 255, 255, 0.92);
        }

        @media (max-width: 560px) {
            .splash-options {
                gap: 32px;
            }

            .splash-card {
                flex-basis: 100%;
                aspect-ratio: 1 / 1;
                justify-content: center;
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>
    <div class="fondo01" aria-hidden="true">
        <div class="fondo01__layer fondo01__layer--a"></div>
        <div class="fondo01__layer fondo01__layer--b"></div>
        <div class="fondo01__layer fondo01__layer--c"></div>
        <div class="fondo01__line fondo01__line--top"></div>
        <div class="fondo01__line fondo01__line--bottom"></div>
    </div>

    <div class="splash-brand">
        <img class="splash-logo" src="/assets/imgs/logos/logo-stacked-gold.png" alt="Argentina 1810 — This is where Argentina begins">
    </div>

    <div class="splash-cta-group">
        <h1 class="splash-slogan">Elegí tu <span class="accent">acceso</span></h1>

        <nav class="splash-options" aria-label="Elegí un sitio">
            <a class="splash-card" href="/cliente/">
                <span class="splash-card__label">Free Explorer</span>
                <span class="splash-card__desc">Viajá por tu cuenta con nuestro acompañamiento.</span>
            </a>
            <a class="splash-card" href="/partners/">
                <span class="splash-card__label">Partner Agency</span>
                <span class="splash-card__desc">Sos agencia y querés vender Argentina con nosotros.</span>
            </a>
        </nav>
    </div>
</body>

</html>
